<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EVO Flight Sim | Giv'ot Eden</title><link rel="icon" href="data:,"><style>html,body{margin:0;height:100%;background:#0c1a20;color:#b7ef88;font:14px Arial}#loading{display:grid;place-content:center;height:100%;text-align:center;gap:15px}small{color:#9db5a8;font-size:11px}#bar{width:220px;height:4px;background:#17323a;border-radius:2px;overflow:hidden;margin:0 auto}#bar i{display:block;height:100%;width:0%;background:#b7ef88;transition:width .15s}</style></head><body><div id="loading"><b>EVO FLIGHT SIM</b><div id="bar"><i id="fill"></i></div><small id="stage">Downloading&hellip; 0%</small></div><script>window.__EVO_PARTS=[]</script><script type="module">try{const F=['8-evo3d-0.js', '9-evo3d-1.js', '10-evo3d-2.js', '11-evo3d-3.js', '12-evo3d-4.js', '14-evo3d-5.js'],TOT=702518,fill=document.getElementById('fill'),stage=document.getElementById('stage');let got=0;const parts=await Promise.all(F.map(async f=>{const r=await fetch(f);if(!r.ok)throw new Error(f+' failed ('+r.status+')');const rd=r.body.getReader(),cs=[];for(;;){const{done,value}=await rd.read();if(done)break;cs.push(value);got+=value.length;const pc=Math.min(99,Math.round(got/TOT*100));fill.style.width=pc+'%';stage.textContent='Downloading\u2026 '+pc+'%'}let n=0;for(const c of cs)n+=c.length;const all=new Uint8Array(n);let o=0;for(const c of cs){all.set(c,o);o+=c.length}const t=new TextDecoder().decode(all),m=t.match(/\[(\d+)\]="([A-Za-z0-9+/=]+)"/);if(!m)throw new Error(f+' corrupt');return[+m[1],m[2]]}));fill.style.width='100%';stage.textContent='Decompressing\u2026';await new Promise(r=>setTimeout(r,30));for(const[i,p]of parts)window.__EVO_PARTS[i]=p;const b=Uint8Array.from(atob(window.__EVO_PARTS.join('')),c=>c.charCodeAt(0));const html=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').innerHTML='<b>EVO FLIGHT SIM</b><small>Loading failed. Please reload in a current Chrome, Edge, Safari or Firefox.<br>'+e.message+'</small>'}</script></body></html>
